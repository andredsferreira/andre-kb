global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape Prometheus's own metrics.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape metrics for the app.
  - job_name: go-prometheus
    static_configs:
      - targets: ["api:8080"]
      
  # Scrape metrics from the actual host machine
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']