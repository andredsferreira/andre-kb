apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: store-api
  namespace: store          # developer's namespace
spec:
  # Attach to a Gateway in a different namespace
  parentRefs:
    - name: production-gateway
      namespace: gateway-infra
      sectionName: https      # attach to the specific listener
  hostnames:
    - "store.example.com"
  rules:
    # Rule 1: Traffic splitting for canary deployment
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2
      backendRefs:
        - name: store-api-stable
          port: 8080
          weight: 90            # 90% to stable
        - name: store-api-canary
          port: 8080
          weight: 10            # 10% to canary
    # Rule 2: Header-based routing for beta features
    - matches:
        - path:
            type: PathPrefix
            value: /api
          headers:
            - name: X-Beta-User
              value: "true"
      backendRefs:
        - name: store-api-beta
          port: 8080
    # Rule 3: Default route
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: store-frontend
          port: 3000