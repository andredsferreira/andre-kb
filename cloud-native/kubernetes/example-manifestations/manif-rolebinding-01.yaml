# RoleBinding example that ties users to a specific Role.

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alice-developer
  namespace: team-frontend
subjects:
- kind: User
  name: alice                     # Name from your identity provider
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer                 # References the Role created with manif-role-01.yaml
  apiGroup: rbac.authorization.k8s.io